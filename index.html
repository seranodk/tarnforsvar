<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c2218">
<title>Tårnforsvar</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#1c2218;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:#fff}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#hud{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 10px;font-weight:800;font-size:16px}
#hud span{white-space:nowrap}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ctrl{display:flex;gap:6px;padding:5px 8px 0}
button,.btn{font:inherit;border:0;border-radius:11px;color:#fff;background:#3d4a33;padding:9px 12px;font-weight:700;font-size:15px;touch-action:manipulation;text-decoration:none;text-align:center}
button:active{filter:brightness(1.3)}
button:disabled{opacity:.45}
#start{flex:1;background:#b5651d}
#panel{padding:5px 8px 6px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;min-height:148px}
#panel.sel{display:flex;flex-wrap:wrap;gap:6px;align-content:center}
#panel.sel button{flex:1 1 auto;padding:10px 8px;font-size:14px}
#preview{display:flex;align-items:center;gap:6px;padding:0 10px 5px;overflow-x:auto;min-height:44px;scrollbar-width:none}
#preview::-webkit-scrollbar{display:none}
.plab{font-weight:800;font-size:13px;opacity:.85;white-space:nowrap}
.chip{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.09);border-radius:10px;padding:2px 7px 2px 3px;font-weight:800;font-size:13px;white-space:nowrap;flex:none}
.chip.boss{border:1.5px solid #e0533f;background:rgba(224,83,63,.18)}
.shop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:3px 0;font-size:10px;line-height:1.15;border:2px solid transparent;border-radius:9px}
.shop b{font-size:19px;font-weight:400}
.shop.sel{border-color:#ffd54a;background:#58693f}
.shop.no{opacity:.5}
.info{flex:1 1 100%;display:flex;align-items:center;font-size:13px;line-height:1.25;padding-left:4px}
#ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#10150ef2;padding:20px;text-align:center}
#ov h1{margin:0;font-size:34px}
#ov p{margin:0;opacity:.85}
.map{width:min(330px,88vw);display:flex;align-items:center;gap:12px;background:#3d4a33;font-size:18px;text-align:left}
.map small{display:block;opacity:.7;font-weight:500;font-size:13px}
#back{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;font-size:13px;padding:8px 10px}
#ver{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));font-size:12px;opacity:.5}
</style>
</head>
<body>
<div id="app">
  <div id="hud"><span id="hLives">🏠 20</span><span id="hGold">💰 380</span><span id="hWave">Bølge 0/20</span><button id="bMenu" style="padding:6px 10px">☰</button></div>
  <div id="preview"></div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="ctrl"><button id="start">▶ Start bølge 1</button><button id="speed">⏩ ×1</button><button id="zoom">🔍</button><button id="pause">⏸</button></div>
  <div id="panel"></div>
</div>
<div id="ov"></div>

<script>
'use strict';
const VERSION='0.6';
const CS=40,MAXWAVE=20,SPD=1.25;let COLS=15,ROWS=22,W=600,H=880;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,3);
let cw=360,ch=520;const cam={x:300,y:0,z:.75};
function minZ(){return Math.min(cw/W,ch/H);}
function clampCam(){cam.z=Math.min(1.8,Math.max(minZ(),cam.z));const vw=cw/cam.z,vh=ch/cam.z;cam.x=vw>=W?W/2:Math.min(W-vw/2,Math.max(vw/2,cam.x));cam.y=vh>=H?H/2:Math.min(H-vh/2,Math.max(vh/2,cam.y));}
function fit(){const st=document.getElementById('stage');cw=Math.max(100,st.clientWidth);ch=Math.max(100,st.clientHeight);cv.width=Math.round(cw*DPR);cv.height=Math.round(ch*DPR);cv.style.width=cw+'px';cv.style.height=ch+'px';clampCam();}
window.addEventListener('resize',fit);

/* ---------- Lyd: kun rigtige optagelser (sounds/<navn>.mp3). Mangler filen, er der bare stille. ---------- */
const SND={};
['mg','sniper','morter','pak','flak','flamme','haubits','pigtraad','mine','doed','byg','liv','vinde','tabt'].forEach(n=>{try{const a=new Audio();a.preload='auto';a.addEventListener('canplaythrough',()=>{SND[n]=a},{once:true});a.src='sounds/'+n+'.mp3';}catch(e){}});
function play(n){try{const a=SND[n];if(a){a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{});}}catch(e){}}

/* ---------- Baner ---------- */
const MAPS=[
 {id:'landevej',name:'Landevejen',emoji:'🏖️',cols:15,rows:22,paths:[
  [[-1,2],[12,2],[12,6],[2,6],[2,10],[12,10],[12,14],[2,14],[2,18],[7,18],[7,22]],
  [[-1,2],[12,2],[12,6],[12,10],[12,14],[2,14],[2,18],[7,18],[7,22]]]},
 {id:'ardenner',name:'Ardennerne',emoji:'🌲',cols:15,rows:22,paths:[
  [[3,-1],[3,6],[7,6],[7,12],[7,16],[2,16],[2,20],[7,20],[7,22]],
  [[3,-1],[3,6],[7,6],[7,12],[7,16],[12,16],[12,20],[7,20],[7,22]],
  [[15,4],[11,4],[11,12],[7,12],[7,16],[2,16],[2,20],[7,20],[7,22]],
  [[15,4],[11,4],[11,12],[7,12],[7,16],[12,16],[12,20],[7,20],[7,22]]]},
 {id:'kryds',name:'Vejkrydset',emoji:'🌉',cols:15,rows:22,paths:[
  [[-1,4],[4,4],[4,11],[10,11],[10,18],[7,18],[7,22]],
  [[15,4],[10,4],[10,11],[4,11],[4,18],[7,18],[7,22]],
  [[7,-1],[7,7],[1,7],[1,15],[7,15],[7,22]]]}
];

/* ---------- Forsvar ----------
 tg: g=kun jord, a=kun luft, b=begge. ap: panserbrydning 0..1 (hvor godt mod pansrede fjender). */
const TT={
 mg:{name:'MG-rede',e:'🔫',cost:60,dmg:7,rng:2.7,rate:.22,ap:0,tg:'b',kind:'shoot',shot:{spd:560,col:'#ffe680',sz:2},sound:'mg',tip:'Hurtig, jord + luft'},
 sniper:{name:'Snigskytte',e:'🎯',cost:90,dmg:42,rng:4.3,rate:1.3,ap:.35,tg:'g',kind:'shoot',shot:{spd:700,col:'#ffffff',sz:2.5},sound:'sniper',tip:'Lang rækkevidde'},
 mine:{path:true,name:'Mine',e:'💥',cost:35,dmg:70,rng:0,rate:0,ap:.7,tg:'g',kind:'mine',splash:1.1,sound:'mine',tip:'Lægges på vejen, 1 gang'},
 wire:{name:'Pigtråd',e:'⛓️',cost:45,dmg:1,rng:1.9,rate:.8,ap:0,tg:'g',kind:'slow',sound:'pigtraad',tip:'Sænker fjenden'},
 flame:{name:'Flamme',e:'🔥',cost:110,dmg:12,rng:1.6,rate:.25,ap:.3,tg:'g',kind:'flame',sound:'flamme',tip:'Skader alle tæt på'},
 morter:{name:'Morter',e:'💣',cost:100,dmg:30,rng:3.4,rate:1.6,ap:.6,tg:'g',kind:'shoot',splash:1.2,shot:{spd:230,col:'#222',sz:5},sound:'morter',tip:'Område-skade'},
 pak:{name:'Pakkanon',e:'🔩',cost:140,dmg:60,rng:3.1,rate:1.4,ap:1,tg:'g',kind:'shoot',shot:{spd:520,col:'#ffa733',sz:4},sound:'pak',tip:'Dræber kampvogne'},
 flak:{name:'Luftværn',e:'🚀',cost:130,dmg:16,rng:3.5,rate:.4,ap:.5,tg:'a',kind:'shoot',splash:.7,shot:{spd:480,col:'#ffffff',sz:3.5},sound:'flak',tip:'Kun fly'},
 haubits:{name:'Haubits',e:'☄️',cost:260,dmg:95,rng:5.6,rate:3.2,ap:.8,tg:'g',kind:'shoot',splash:1.7,shot:{spd:260,col:'#111',sz:6.5},sound:'haubits',tip:'Enorm rækkevidde'},
 radio:{name:'Stab',e:'📡',cost:120,dmg:0,rng:2.9,rate:0,ap:0,tg:'b',kind:'buff',sound:'byg',tip:'Giver nabo-tårne bonus'},
 barr:{path:true,name:'Barrikade',e:'🧱',cost:30,rng:0,dmg:0,kind:'barrier',hp:260,res:1,tg:'g',sound:'byg',tip:'Spærrer vejen. Fjenden går udenom eller skyder den i stykker'},
 hedge:{path:true,name:'Pindsvin',e:'✴️',cost:75,rng:0,dmg:0,kind:'barrier',hp:850,res:.5,tg:'g',sound:'byg',tip:'Stålspærring. Tåler meget, holder kampvogne tilbage'}
};
Object.assign(TT.mg,{muz:21});Object.assign(TT.sniper,{muz:28});Object.assign(TT.morter,{muz:17});Object.assign(TT.pak,{muz:28});Object.assign(TT.flak,{muz:30});Object.assign(TT.haubits,{muz:32});
const DPS={soldat:8,motor:10,jeep:14,halv:22,panzer:45,tiger:70,boss1:170};
const PRIO=['first','strong','fast','weak'],PRIONAME={first:'Forreste',strong:'Stærkeste',fast:'Hurtigste',weak:'Svageste'};
const LM=[1,1.7,2.6],RM=[1,1.1,1.2],UP=[0,.7,1.1],BUFF=[.25,.4,.55];

/* ---------- Fjender ---------- */
const EN={
 soldat:{e:'🪖',hp:24,spd:50,rew:5,sz:22,dmg:1,armor:0},
 motor:{e:'🏍️',hp:30,spd:95,rew:6,sz:28,dmg:1,armor:0},
 jeep:{e:'🚙',hp:75,spd:72,rew:9,sz:30,dmg:1,armor:.1},
 halv:{e:'🚛',hp:170,spd:44,rew:15,sz:36,dmg:2,armor:.3},
 panzer:{tank:1,col:'#6b705c',hp:260,spd:36,rew:22,sz:34,dmg:2,armor:.6},
 tiger:{tank:1,col:'#464a41',hp:520,spd:28,rew:42,sz:44,dmg:3,armor:.75},
 fald:{e:'🪂',air:1,hp:28,spd:34,rew:6,sz:24,dmg:1,armor:0},
 stuka:{e:'🛩️',air:1,hp:90,spd:80,rew:12,sz:34,dmg:1,armor:.2},
 bombe:{e:'✈️',air:1,hp:340,spd:46,rew:30,sz:46,dmg:3,armor:.3},
 boss1:{tank:1,col:'#30332c',hp:1500,spd:22,rew:180,sz:62,dmg:8,armor:.8},
 boss2:{e:'✈️',air:1,hp:2400,spd:30,rew:300,sz:68,dmg:10,armor:.45}
};
const POOL=[['soldat',1,6],['motor',2,3],['jeep',3,3],['fald',4,2],['halv',5,3],['stuka',6,2],['panzer',8,3],['bombe',11,1.5],['tiger',13,2]];

/* ---------- Tilstand ---------- */
let state='menu',map=null,pathCells=new Set(),pts=[],blocked=new Map();
let towers,enemies,shots,fx,gold,lives,wave,spawnList,spawnT,hpm,waveActive,speed,paused,sel,shop,hov,spawnIdx,time;

function buildPathCells(m){const s=new Set();for(const p of m.paths)for(let i=0;i<p.length-1;i++){const [x0,y0]=p[i],[x1,y1]=p[i+1];const dx=Math.sign(x1-x0),dy=Math.sign(y1-y0);let x=x0,y=y0;for(let g=0;g<99;g++){s.add(x+','+y);if(x===x1&&y===y1)break;x+=dx;y+=dy;}}return s;}
function buildBlocked(){const m=new Map();
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(pathCells.has(c+','+r))continue;let near=false;for(let dr=-1;dr<=1&&!near;dr++)for(let dc=-1;dc<=1;dc++)if(pathCells.has((c+dc)+','+(r+dr))){near=true;break;}
  if(near)continue;const h=hash(c*7+3,r*11+5);if(h%100<17)m.set(c+','+r,(h>>>8)%5);}
 return m;}
function best(id){try{return +localStorage.getItem('tf2_best_'+id)||0}catch(e){return 0}}
function saveBest(id,w){try{if(w>best(id))localStorage.setItem('tf2_best_'+id,w)}catch(e){}}

function newGame(m){
 map=m;COLS=m.cols;ROWS=m.rows;W=COLS*CS;H=ROWS*CS;cam.x=W/2;cam.y=0;cam.z=.75;pathCells=buildPathCells(m);blocked=buildBlocked();pts=m.paths.map(p=>p.map(([c,r])=>[(c+.5)*CS,(r+.5)*CS]));
 entries=[];for(const p of m.paths){const k=p[0][0]+','+p[0][1];if(!entries.some(e=>e.k===k)){const dx=Math.sign(p[1][0]-p[0][0]),dy=Math.sign(p[1][1]-p[0][1]);entries.push({k,c:p[0][0],r:p[0][1],dx,dy,hd:dirIdx(dx,dy)});}}
 exits=new Set(m.paths.map(p=>p[p.length-1][0]+','+p[p.length-1][1]));const ex=m.paths[0][m.paths[0].length-1];exitCell={c:ex[0],r:ex[1]};
 towers=[];enemies=[];shots=[];fx=[];gold=380;lives=20;wave=0;spawnList=[];spawnT=0;hpm=1;waveActive=false;speed=1;paused=false;sel=null;shop='mg';hov=null;spawnIdx=0;time=0;
 recalcField();fieldT=.5;upcoming=makeWave(1);
 state='play';hideOv();hud();setPanel();updStart();fit();$('pause').textContent='⏸';$('speed').textContent='⏩ ×1';
}

/* ---------- Bølger ---------- */
function makeWave(n){
 const pool=POOL.filter(p=>n>=p[1]).map(p=>[p[0],p[0]==='soldat'?Math.max(1,p[2]-n/3):p[2]]);
 const tot=pool.reduce((a,p)=>a+p[1],0);const list=[];const cnt=6+Math.floor(n*1.5);
 const en=()=>Math.floor(Math.random()*entries.length);
 for(let i=0;i<cnt;i++){let r=Math.random()*tot;for(const p of pool){r-=p[1];if(r<=0){list.push({ty:p[0],en:en()});break;}}}
 if(n===10)list.push({ty:'boss1',en:en()});
 if(n===20){list.push({ty:'boss1',en:en()});list.push({ty:'boss2',en:en()});}
 return list;
}
function startWave(){
 if(state!=='play'||spawnList.length||wave>=MAXWAVE)return;
 wave++;spawnList=upcoming||makeWave(wave);upcoming=wave<MAXWAVE?makeWave(wave+1):null;hpm=Math.pow(1.075,wave-1);waveActive=true;spawnT=0;hud();updStart();
}

/* ---------- Opdatering ---------- */
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
let field=new Map(),barMap=new Map(),entries=[],exits=new Set(),exitCell={c:7,r:22},fieldDirty=true,fieldT=0,upcoming=null;
function dirIdx(dx,dy){return dx>0?0:dy>0?1:dx<0?2:dy<0?3:0;}
function bCost(k){const t=barMap.get(k);return 1+(t&&!t.dead?8+t.hp/45:0);}
function recalcField(){
 const bm=new Map();for(const t of towers){if(TT[t.k].kind==='barrier'&&!t.dead)bm.set(t.c+','+t.r,t);}
 barMap=bm;const f=new Map(),done=new Set();for(const k of exits)f.set(k,0);
 for(;;){let bk=null,bv=1e9;for(const [k,v] of f){if(!done.has(k)&&v<bv){bv=v;bk=k;}}if(bk===null)break;done.add(bk);
  const [c,r]=bk.split(',').map(Number);
  for(const [dc,dr] of DIRS){const nk=(c+dc)+','+(r+dr);if(!pathCells.has(nk)||done.has(nk))continue;const cand=bv+bCost(bk);if(!f.has(nk)||cand<f.get(nk))f.set(nk,cand);}}
 field=f;fieldDirty=false;
}
function stepFrom(c,r,hd){let best=null,bv=1e9;for(const o of [0,1,3,2]){const [dc,dr]=DIRS[(hd+o)%4];const nk=(c+dc)+','+(r+dr);if(!field.has(nk))continue;const v=bCost(nk)+field.get(nk);if(v<bv-1e-9){bv=v;best=[c+dc,r+dr];}}return best;}
function remOf(e){const k=e.tc?e.tc[0]+','+e.tc[1]:e.cc+','+e.cr;const fv=field.get(k);return (fv===undefined?999:fv)+(e.tc?Math.hypot((e.tc[0]+.5)*CS-e.x,(e.tc[1]+.5)*CS-e.y)/CS:0);}
function moveEnemy(e,dt){
 const sp=e.spd*(e.slow>0?.5:1);e.slow=Math.max(0,e.slow-dt);let left=sp*dt;
 while(left>0&&e.wp<e.pts.length){const [tx,ty]=e.pts[e.wp];const dx=tx-e.x,dy=ty-e.y;const d=Math.hypot(dx,dy);e.ang=Math.atan2(dy,dx);
  if(d<=left){e.x=tx;e.y=ty;left-=d;e.dist+=d;e.wp++;}else{e.x+=dx/d*left;e.y+=dy/d*left;e.dist+=left;left=0;}}
 if(e.wp>=e.pts.length)e.escaped=true;
 const ex=(exitCell.c+.5)*CS,ey=(exitCell.r+.5)*CS;e.rem=Math.hypot(ex-e.x,ey-e.y)/CS;
}
function moveGround(e,dt){
 const sp=e.spd*(e.slow>0?.5:1);e.slow=Math.max(0,e.slow-dt);let left=sp*dt;e.hold=null;
 for(let g=0;g<8&&left>0;g++){
  if(!e.tc){const nx=stepFrom(e.cc,e.cr,e.hd);if(!nx){e.escaped=true;return;}e.tc=nx;}
  const tk=e.tc[0]+','+e.tc[1];const bt=barMap.get(tk);const tx=(e.tc[0]+.5)*CS,ty=(e.tc[1]+.5)*CS;
  const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);
  if(d>1){const ta=Math.atan2(dy,dx);e.ang+=Math.atan2(Math.sin(ta-e.ang),Math.cos(ta-e.ang))*Math.min(1,dt*10);}
  if(bt&&!bt.dead){
   const stop=CS*.62;
   if(d<=stop+.5){
    e.hold=bt;
    const alt=stepFrom(e.cc,e.cr,e.hd);
    if(alt&&(alt[0]!==e.tc[0]||alt[1]!==e.tc[1])){e.tc=[e.cc,e.cr];continue;}
    bt.hp-=(DPS[e.ty]||10)*dt*(TT[bt.k].res||1);bt.shake=.12;
    if(bt.sparkT<=0){fx.push({k:'ring',x:bt.x,y:bt.y,r:0,max:15,col:'255,200,90',t:.22,T:.22});bt.sparkT=.3;}
    if(bt.hp<=0){bt.dead=true;fieldDirty=true;fx.push({k:'boom',x:bt.x,y:bt.y,r:26,t:.5,T:.5,big:true});fx.push({k:'txt',x:bt.x,y:bt.y-14,s:TT[bt.k].name+' ødelagt!',t:1.2,T:1.2});play('doed');}
    e.rem=remOf(e);return;}
   const mv=Math.max(0,Math.min(left,d-stop));e.x+=dx/d*mv;e.y+=dy/d*mv;e.dist+=mv;left-=mv;if(mv<=0)break;continue;}
  if(d<=left){e.x=tx;e.y=ty;left-=d;e.dist+=d;e.hd=dirIdx(e.tc[0]-e.cc,e.tc[1]-e.cr);e.cc=e.tc[0];e.cr=e.tc[1];e.tc=null;if(exits.has(e.cc+','+e.cr)){e.escaped=true;return;}}
  else{e.x+=dx/d*left;e.y+=dy/d*left;e.dist+=left;left=0;}
 }
 e.rem=remOf(e);
}
function dmgEnemy(e,d,ap,own){e.hp-=d*(1-e.armor*(1-ap));e.flash=.1;if(own)e.last=own;}
function canHit(d,e){return d.tg==='b'||(d.tg==='a')===!!e.air;}
function buffOf(t){let b=0;for(const o of towers){if(o.k==='radio'&&o!==t&&Math.hypot(o.x-t.x,o.y-t.y)<=TT.radio.rng*CS*RM[o.lvl])b+=BUFF[o.lvl];}return 1+Math.min(1,b);}
function scoreOf(e,pr){return pr==='strong'?e.hp:pr==='weak'?-e.hp:pr==='fast'?e.spd*(e.slow>0?.5:1):-e.rem;}
function credit(t){if(!t||t.dead)return;const d=TT[t.k];if(d.kind==='mine'||d.kind==='buff'||d.kind==='barrier')return;t.kills=(t.kills||0)+1;const nv=t.kills>=60?3:t.kills>=25?2:t.kills>=8?1:0;
 if(nv>(t.vet||0)){t.vet=nv;fx.push({k:'txt',x:t.x,y:t.y-26,s:'★ Veteran '+'★'.repeat(nv),t:1.5,T:1.5});if(sel===t)setPanel();}}
function update(dt){
 time+=dt;
 fieldT-=dt;if(fieldDirty||fieldT<=0){recalcField();fieldT=.5;}
 if(spawnList.length){spawnT-=dt;if(spawnT<=0){const u=spawnList.shift();const ty=u.ty,d=EN[ty];const en=entries[u.en%entries.length];
  const boss=ty.startsWith('boss');const hp=d.hp*(boss?Math.sqrt(hpm):hpm);
  const o={ty,x:(en.c+.5)*CS,y:(en.r+.5)*CS,hp,max:hp,spd:d.spd*SPD,armor:d.armor,air:!!d.air,slow:0,dist:0,flash:0,ang:Math.atan2(en.dy,en.dx),seed:Math.random()*20,cc:en.c,cr:en.r,tc:null,hd:en.hd,rem:999,last:null,hold:null};
  if(o.air){o.pts=[[o.x,o.y],[(exitCell.c+.5)*CS,(exitCell.r+.5)*CS]];o.wp=1;}
  enemies.push(o);spawnT=d.spd>=70?.5:boss?2:.8;}}

}
function star(g,x,y,r,col){g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const q=i%2?r*.45:r;g.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}g.closePath();g.fillStyle=col;g.fill();g.strokeStyle='#1c1c1c';g.lineWidth=.8;g.stroke();}
function enemyIcon(ty,px){const c=document.createElement('canvas');c.width=c.height=Math.round(px*DPR);c.style.width=c.style.height=px+'px';const g=c.getContext('2d');const d=EN[ty];const sc=Math.min(1.25,px/(d.sz*1.15))*DPR;g.setTransform(sc,0,0,sc,DPR*px/2,DPR*px/2);drawEnemy(g,ty,-.35,0,.6,1);return c;}
function renderPreview(){
 const el=$('preview');el.innerHTML='';if(!map)return;
 const lab=document.createElement('div');lab.className='plab';lab.textContent=wave>=MAXWAVE?'Sidste bølge':(waveActive?'Næste:':'Bølge '+(wave+1)+':');el.appendChild(lab);
 if(!upcoming)return;
 const cnt=new Map();for(const u of upcoming)cnt.set(u.ty,(cnt.get(u.ty)||0)+1);
 for(const ty of Object.keys(EN)){if(!cnt.has(ty))continue;const chip=document.createElement('div');chip.className='chip'+(ty.startsWith('boss')?' boss':'');chip.appendChild(enemyIcon(ty,30));const sp=document.createElement('span');sp.textContent='×'+cnt.get(ty);chip.appendChild(sp);el.appendChild(chip);}
}
function drawRoutes(){
 ctx.save();ctx.lineJoin='round';
 for(const pass of [0,1]){ctx.setLineDash(pass?[8,7]:[]);ctx.lineDashOffset=-anim*34;ctx.strokeStyle=pass?'rgba(255,224,90,.95)':'rgba(0,0,0,.35)';ctx.lineWidth=pass?3:6;
  for(const en of entries){let c=en.c,r=en.r,hd=en.hd;ctx.beginPath();ctx.moveTo((c+.5)*CS,(r+.5)*CS);for(let i=0;i<240;i++){if(exits.has(c+','+r))break;const nx=stepFrom(c,r,hd);if(!nx)break;hd=dirIdx(nx[0]-c,nx[1]-r);c=nx[0];r=nx[1];ctx.lineTo((c+.5)*CS,(r+.5)*CS);}ctx.stroke();}}
 ctx.restore();
}
function draw(){
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#10150e';ctx.fillRect(0,0,cv.width,cv.height);
 if(!map)return;
 const kz=DPR*cam.z;ctx.setTransform(kz,0,0,kz,(cw/2-cam.x*cam.z)*DPR,(ch/2-cam.y*cam.z)*DPR);
 const c0=Math.max(0,Math.floor((cam.x-cw/2/cam.z)/CS)),c1=Math.min(COLS-1,Math.ceil((cam.x+cw/2/cam.z)/CS)),r0=Math.max(0,Math.floor((cam.y-ch/2/cam.z)/CS)),r1=Math.min(ROWS-1,Math.ceil((cam.y+ch/2/cam.z)/CS));
 for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const p=pathCells.has(c+','+r);ctx.fillStyle=p?((r+c)%2?'#a58a63':'#9d835d'):((r+c)%2?'#74804c':'#6e7a47');ctx.fillRect(c*CS,r*CS,CS,CS);
  if(!p&&hash(c,r)%6===0){ctx.fillStyle='rgba(0,0,0,.13)';ctx.beginPath();ctx.ellipse(c*CS+10+hash(r,c)%20,r*CS+12+hash(c,c+r)%16,9,5,0,0,7);ctx.fill();}}
 ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=4;ctx.strokeRect(0,0,W,H);drawMarkers();if((shop&&TT[shop].kind==='barrier'&&!sel)||(sel&&TT[sel.k].kind==='barrier'))drawRoutes();for(const [k2,v2] of blocked){const [bc,br]=k2.split(',').map(Number);if(bc>=c0&&bc<=c1&&br>=r0&&br<=r1)drawTree(ctx,bc*CS+CS/2,br*CS+CS/2,v2);}
 ctx.textAlign='center';ctx.textBaseline='middle';
 if(sel){const d=TT[sel.k];ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.arc(sel.x,sel.y,d.rng*CS*RM[sel.lvl],0,7);ctx.fill();}
 else if(shop&&hov&&hov.c>=0&&hov.c<COLS&&hov.r>=0&&hov.r<ROWS&&!towerAt(hov.c,hov.r)&&!blocked.has(hov.c+','+hov.r)&&!!TT[shop].path===pathCells.has(hov.c+','+hov.r)&&TT[shop].rng){ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.arc((hov.c+.5)*CS,(hov.r+.5)*CS,TT[shop].rng*CS,0,7);ctx.fill();}
 for(const t of towers.slice().sort((a,b)=>a.y-b.y)){
  ctx.save();ctx.translate(t.x+((t.shake>0)?Math.sin(anim*70)*1.4:0),t.y);drawTower(ctx,t.k,t.lvl,t.ang,t.rec,anim);chev(ctx,t.lvl+1);
  for(let i=0;i<(t.vet||0);i++)star(ctx,14-i*7.5,-15,4.3,'#e9eff6');
  if(TT[t.k].kind==='barrier'&&t.hp<t.maxhp){ctx.fillStyle='#0009';ctx.fillRect(-14,-23,28,4);ctx.fillStyle=t.hp/t.maxhp>.5?'#5ddc5d':t.hp/t.maxhp>.25?'#f1c40f':'#e74c3c';ctx.fillRect(-14,-23,28*Math.max(0,t.hp/t.maxhp),4);}
  if(t===sel){ctx.strokeStyle='#ffd54a';ctx.lineWidth=2.2;ctx.setLineDash([5,4]);ctx.lineDashOffset=-anim*10;ctx.beginPath();ctx.arc(0,0,20,0,7);ctx.stroke();ctx.setLineDash([]);}
  ctx.restore();}
 const air=[];
 for(const e of enemies){if(e.air){air.push(e);continue;}
  const d=EN[e.ty];
  if(e.slow>0){ctx.fillStyle='rgba(215,220,225,.35)';ctx.beginPath();ctx.arc(e.x,e.y,d.sz*.55,0,7);ctx.fill();ctx.strokeStyle='rgba(240,240,240,.7)';ctx.lineWidth=1;ctx.setLineDash([2,3]);ctx.stroke();ctx.setLineDash([]);}
  ctx.save();ctx.translate(e.x,e.y);drawEnemy(ctx,e.ty,e.ang,e.dist*.3,anim,e.seed);
  if(e.flash>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.34;drawEnemy(ctx,e.ty,e.ang,e.dist*.3,anim,e.seed);}
  ctx.restore();hpbar(e,d);}
 for(const e of air){const d=EN[e.ty];
  if(e.ty!=='fald'){ctx.save();ctx.translate(e.x+9,e.y+14);drawAirShadow(ctx,e.ty,e.ang);ctx.restore();}
  ctx.save();ctx.translate(e.x,e.y);drawEnemy(ctx,e.ty,e.ang,0,anim,e.seed);
  if(e.flash>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.34;drawEnemy(ctx,e.ty,e.ang,0,anim,e.seed);}
  ctx.restore();hpbar(e,d);}
 for(const s of shots){
  if(!s.splash){const L=s.d===TT.mg?8:s.d===TT.flak?9:13;ctx.lineCap='round';ctx.strokeStyle='rgba(255,200,80,.35)';ctx.lineWidth=s.sz+2;ctx.beginPath();ctx.moveTo(s.x-s.ux*L,s.y-s.uy*L);ctx.lineTo(s.x,s.y);ctx.stroke();ctx.strokeStyle=s.col;ctx.lineWidth=s.sz*.8;ctx.beginPath();ctx.moveTo(s.x-s.ux*L*.7,s.y-s.uy*L*.7);ctx.lineTo(s.x,s.y);ctx.stroke();}
  else{ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(s.x-s.ux*5,s.y-s.uy*5,s.sz*.8,0,7);ctx.fill();ctx.fillStyle=s.col;ctx.beginPath();ctx.arc(s.x,s.y,s.sz,0,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1;ctx.stroke();}}
 for(const f of fx){const a=f.t/f.T;if(f.k==='boom'){drawBoom(f);}else if(f.k==='ring'){ctx.strokeStyle='rgba('+f.col+','+a+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,f.max*(1-a),0,7);ctx.stroke();}
  else{ctx.font='bold 14px sans-serif';ctx.fillStyle='rgba(255,255,255,'+Math.min(1,a*1.5)+')';ctx.strokeStyle='rgba(0,0,0,'+Math.min(1,a*1.5)+')';ctx.lineWidth=3;const y=f.y-(1-a)*24;ctx.strokeText(f.s,f.x,y);ctx.fillText(f.s,f.x,y);}}
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(state==='play'&&!towers.length&&wave===0){ctx.font='bold 14px sans-serif';ctx.fillStyle='#fff';ctx.strokeStyle='#000a';ctx.lineWidth=3;const m=(shop&&TT[shop].path)?TT[shop].name+' lægges på selve vejen':'Tryk på jorden for at bygge';ctx.strokeText(m,cw/2,ch-22);ctx.fillText(m,cw/2,ch-22);}
 if(paused&&state==='play'){ctx.fillStyle='#0008';ctx.fillRect(0,0,cw,ch);ctx.font='bold 34px sans-serif';ctx.fillStyle='#fff';ctx.fillText('PAUSE',cw/2,ch/2);}
}
function hpbar(e,d){const bw=Math.max(18,d.sz);const y=e.y-d.sz*.5-7;ctx.fillStyle='#0008';ctx.fillRect(e.x-bw/2,y,bw,4);ctx.fillStyle=e.hp/e.max>.5?'#5ddc5d':e.hp/e.max>.25?'#f1c40f':'#e74c3c';ctx.fillRect(e.x-bw/2,y,bw*Math.max(0,e.hp/e.max),4);}

/* ---------- Brugerflade ---------- */
const $=id=>document.getElementById(id);
function hud(){if(!map)return;$('hLives').textContent='🏠 '+lives;$('hGold').textContent='💰 '+Math.floor(gold);$('hWave').textContent='Bølge '+wave+'/'+MAXWAVE;}
function updStart(){const b=$('start');b.disabled=spawnList.length>0||state!=='play'||wave>=MAXWAVE;b.textContent=wave>=MAXWAVE?'Sidste bølge!':'▶ Start bølge '+(wave+1);renderPreview();}
function upCost(t){return t.lvl<2?Math.round(TT[t.k].cost*UP[t.lvl+1]):0;}
function maxHp(t){return TT[t.k].hp*[1,1.9,3][t.lvl];}
function infoText(t){const d=TT[t.k];let s=`<b>${d.name}</b> niv. ${t.lvl+1}`+(t.vet?' '+'★'.repeat(t.vet):'')+'<br>';
 if(d.kind==='buff')s+='Bonus +'+Math.round(BUFF[t.lvl]*100)+'% til nabo-tårne';
 else if(d.kind==='slow')s+='Sænker fjender';
 else if(d.kind==='barrier')s+='Styrke '+Math.ceil(t.hp)+' / '+Math.round(t.maxhp);
 else s+='Skade '+Math.round(d.dmg*LM[t.lvl]*(1+.12*(t.vet||0)));
 if((t.kills||0)>0)s+=' · '+t.kills+' drab'+(t.vet<3?' (næste ★ ved '+(t.vet===0?8:t.vet===1?25:60)+')':'');
 return s;}
function setPanel(){
 const p=$('panel');p.innerHTML='';p.className=sel?'sel':'';
 if(sel){const d=TT[sel.k];const up=upCost(sel);const sell=Math.floor(sel.spent*.7);
  const i=document.createElement('div');i.className='info';i.style.gap='8px';i.appendChild(iconCanvas(sel.k,46,sel.lvl,-0.7));const tx=document.createElement('div');tx.innerHTML=infoText(sel);i.appendChild(tx);p.appendChild(i);
  if(d.kind==='shoot'){const b=document.createElement('button');b.textContent='🎯 '+PRIONAME[sel.prio||'first'];b.onclick=()=>{const cur=PRIO.indexOf(sel.prio||'first');sel.prio=PRIO[(cur+1)%PRIO.length];setPanel();};p.appendChild(b);}
  if(d.kind==='barrier'){const cost=Math.ceil((1-sel.hp/sel.maxhp)*d.cost*.8);const b=document.createElement('button');b.id='rep';b.textContent=cost>0?'🔧 '+cost+'💰':'🔧 Intakt';b.disabled=cost<=0||gold<cost;b.onclick=()=>{if(gold>=cost&&cost>0){gold-=cost;sel.hp=sel.maxhp;fieldDirty=true;play('byg');hud();setPanel();}};p.appendChild(b);}
  if(sel.lvl<2){const b=document.createElement('button');b.id='upg';b.textContent='⬆ '+up+'💰';b.disabled=gold<up;b.onclick=()=>{const u=upCost(sel);if(gold>=u){gold-=u;sel.spent+=u;sel.lvl++;if(d.kind==='barrier'){sel.maxhp=maxHp(sel);sel.hp=sel.maxhp;fieldDirty=true;}play('byg');hud();setPanel();}};p.appendChild(b);}
  const s=document.createElement('button');s.textContent='Sælg +'+sell;s.onclick=()=>{towers=towers.filter(t=>t!==sel);gold+=sell;sel=null;fieldDirty=true;hud();setPanel();};p.appendChild(s);
  const x=document.createElement('button');x.textContent='✖';x.style.flex='0 0 auto';x.onclick=()=>{sel=null;setPanel();};p.appendChild(x);
 }else{
  for(const k in TT){const d=TT[k];const b=document.createElement('button');b.className='shop'+(shop===k?' sel':'')+(gold<d.cost?' no':'');b.dataset.k=k;
   b.appendChild(iconCanvas(k,34,0,-0.75));const nm=document.createElement('span');nm.textContent=d.name;b.appendChild(nm);const pr=document.createElement('span');pr.textContent=d.cost+'💰';b.appendChild(pr);b.onclick=()=>{shop=shop===k?null:k;setPanel();if(shop)hint(TT[shop]);};p.appendChild(b);}
 }
}
function hint(d){fx.push({k:'txt',x:cam.x,y:cam.y+ch/(2*cam.z)-60/cam.z,s:d.name+': '+d.tip,t:1.6,T:1.6});}
function showOv(h){const o=$('ov');o.innerHTML=h;o.style.display='flex';}
function hideOv(){$('ov').style.display='none';}
function showMenu(){
 state='menu';map=null;
 showOv(`<a id="back" class="btn" href="https://seranodk.github.io/">Tilbage til spillehallen</a><h1>🎖️ Tårnforsvar</h1><p>Anden verdenskrig. Hold stand med 10 slags forsvar<br>mod soldater, kampvogne og fly!</p>`+
 MAPS.map((m,i)=>`<button class="btn map" data-i="${i}"><span style="font-size:30px">${m.emoji}</span><span>${m.name}<small>Bedste: bølge ${best(m.id)}/${MAXWAVE}</small></span></button>`).join('')+`<div id="ver">v${VERSION}</div>`);
 document.querySelectorAll('#ov .map[data-i]').forEach(b=>b.onclick=()=>newGame(MAPS[+b.dataset.i]));
}

/* ---------- Input ---------- */
function towerAt(c,r){return towers.find(t=>t.c===c&&t.r===r);}
function cellFrom(e){const rc=cv.getBoundingClientRect();const wx=cam.x+(e.clientX-rc.left-cw/2)/cam.z,wy=cam.y+(e.clientY-rc.top-ch/2)/cam.z;return{c:Math.floor(wx/CS),r:Math.floor(wy/CS)};}
const ptrs=new Map();let pv=null,pinched=false;
function two(){const a=[...ptrs.values()];return{d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2};}
function zoomAt(mx,my,f){const wx=cam.x+(mx-cw/2)/cam.z,wy=cam.y+(my-ch/2)/cam.z;cam.z*=f;cam.z=Math.min(1.8,Math.max(minZ(),cam.z));cam.x=wx-(mx-cw/2)/cam.z;cam.y=wy-(my-ch/2)/cam.z;clampCam();}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}
 ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:false});
 if(ptrs.size===2){pv=two();pinched=true;for(const p of ptrs.values())p.moved=true;}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);
 if(e.pointerType==='mouse')hov=cellFrom(e);
 if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(Math.hypot(p.x-p.sx,p.y-p.sy)>9)p.moved=true;
 if(ptrs.size===1&&p.moved){cam.x-=dx/cam.z;cam.y-=dy/cam.z;clampCam();}
 else if(ptrs.size===2&&pv){const n=two();const rc=cv.getBoundingClientRect();const wx=cam.x+(pv.mx-rc.left-cw/2)/cam.z,wy=cam.y+(pv.my-rc.top-ch/2)/cam.z;cam.z=Math.min(1.8,Math.max(minZ(),cam.z*n.d/pv.d));cam.x=wx-(n.mx-rc.left-cw/2)/cam.z;cam.y=wy-(n.my-rc.top-ch/2)/cam.z;clampCam();pv=n;}});
cv.addEventListener('pointerup',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const wasOne=ptrs.size===1;ptrs.delete(e.pointerId);
 if(wasOne&&!p.moved&&!pinched)tapAt(e);if(ptrs.size===0)pinched=false;else if(ptrs.size===1)pv=null;});
cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);if(!ptrs.size)pinched=false;});
cv.addEventListener('wheel',e=>{e.preventDefault();const rc=cv.getBoundingClientRect();zoomAt(e.clientX-rc.left,e.clientY-rc.top,Math.exp(-e.deltaY*.0015));},{passive:false});
function tapAt(e){
 if(state!=='play'||paused)return;
 const {c,r}=cellFrom(e);if(c<0||c>=COLS||r<0||r>=ROWS)return;hov={c,r};
 const t=towerAt(c,r);if(t){sel=t;shop=null;setPanel();return;}
 const onPath=pathCells.has(c+','+r);
 if(blocked.has(c+','+r)){fx.push({k:'txt',x:(c+.5)*CS,y:(r+.5)*CS,s:'Her kan man ikke bygge',t:1,T:1});return;}
 if(!shop){if(sel){sel=null;setPanel();}return;}
 const d=TT[shop];const cx=(c+.5)*CS,cy=(r+.5)*CS;
 if(!!d.path!==onPath){if(d.path)fx.push({k:'txt',x:cx,y:cy,s:d.name+' lægges på vejen',t:1,T:1});return;}
 if(gold<d.cost){fx.push({k:'txt',x:cx,y:cy,s:'For få 💰',t:.8,T:.8});return;}
 gold-=d.cost;towers.push({c,r,x:cx,y:cy,k:shop,lvl:0,cd:0,spent:d.cost,ang:-Math.PI/2,rec:0,kills:0,vet:0,prio:'first',hp:d.hp||0,maxhp:d.hp||0,shake:0,sparkT:0});if(d.kind==='barrier')fieldDirty=true;play('byg');hud();setPanel();
}
$('start').onclick=startWave;
$('speed').onclick=()=>{speed=speed===1?2:1;$('speed').textContent='⏩ ×'+speed;};
$('zoom').onclick=()=>{if(!map)return;cam.z=cam.z>minZ()*1.2?minZ():1.15;clampCam();};
$('pause').onclick=()=>{if(state!=='play')return;paused=!paused;$('pause').textContent=paused?'▶':'⏸';};
$('bMenu').onclick=()=>{if(state==='play'){paused=true;$('pause').textContent='▶';showOv(`<h1>Pause</h1><button class="btn map" id="cont" style="justify-content:center">Fortsæt</button><button class="btn map" id="rest" style="justify-content:center">Start forfra</button><button class="btn map" id="tomenu" style="justify-content:center">Menu</button>`);
 $('cont').onclick=()=>{paused=false;$('pause').textContent='⏸';hideOv();};$('rest').onclick=()=>newGame(map);$('tomenu').onclick=showMenu;}};
['gesturestart','gesturechange','gestureend','dblclick','contextmenu'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

/* ---------- Løkke ---------- */
let last=0,gSeen=-1;
function frame(ts){
 const dt=Math.min(.05,(ts-last)/1000||0);last=ts;anim=ts/1000;
 if(state==='play'&&!paused){update(dt*speed);if(Math.floor(gold)!==gSeen){gSeen=Math.floor(gold);panelLight();}}
 draw();requestAnimationFrame(frame);
}
// opdater kun knappernes tilstand (ikke hele panelet), så et tryk ikke går tabt
function panelLight(){
 if(sel){const u=$('upg');if(u&&sel.lvl<2)u.disabled=gold<upCost(sel);return;}
 for(const b of $('panel').children){if(b.dataset&&b.dataset.k)b.classList.toggle('no',gold<TT[b.dataset.k].cost);}
}
if(typeof window!=='undefined'&&typeof requestAnimationFrame==='function'){fit();showMenu();requestAnimationFrame(frame);}
</script>
</body>
